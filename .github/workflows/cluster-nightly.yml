name: cluster-nightly

# Every exo.testkit cluster scenario, the slow ones included: real exo nodes on one machine
# with a stub engine instead of MLX, so a plain install without MLX is enough.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  cluster:
    name: Cluster scenarios (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - uses: astral-sh/setup-uv@v6

      - name: Install exo without MLX
        run: uv sync --python 3.13 --locked

      - name: Run every cluster scenario
        run: uv run --locked pytest src/exo/testkit -m "" -rxXf
